name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

jobs:
  release:
    uses: Themekraft/release-tooling/.github/workflows/release.yml@main
    with:
      slug: woocommerce-checkout
      freemius-id: "3326"
      main-file: loader.php
      wporg: false
    secrets: inherit
